<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="t">
  <title id="t">Harness Engineering: an agent loop wrapped by seven subsystems</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="160" height="160" rx="32" fill="url(#bg)"/>

  <!-- outer ring: the harness -->
  <circle cx="80" cy="80" r="56" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="3 5"/>

  <!-- seven subsystems on the ring -->
  <g fill="#0f172a" stroke="url(#ring)" stroke-width="3">
    <circle cx="80.0"  cy="24.0"  r="7"/>
    <circle cx="123.8" cy="45.1"  r="7"/>
    <circle cx="134.6" cy="92.5"  r="7"/>
    <circle cx="104.3" cy="130.5" r="7"/>
    <circle cx="55.7"  cy="130.5" r="7"/>
    <circle cx="25.4"  cy="92.5"  r="7"/>
    <circle cx="36.2"  cy="45.1"  r="7"/>
  </g>

  <!-- inner loop: query, act, observe, repeat -->
  <path d="M 80 52 A 28 28 0 1 1 52.3 84" fill="none" stroke="url(#ring)" stroke-width="6"
        stroke-linecap="round" marker-end="url(#head)"/>

  <!-- the model at the center -->
  <circle cx="80" cy="80" r="10" fill="#38bdf8"/>
  <circle cx="80" cy="80" r="4" fill="#0f172a"/>
</svg>
